name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21.0.13
          cache: gradle
      - run: python3 scripts/check-toolchain.py
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 scripts/check-knowledge.py
      - run: python3 scripts/check-startup-budget.py
      - run: ./gradlew check :engine:exportPilotReview :engine:koverVerify :server:koverVerify :server:installDist --dependency-verification strict --no-daemon
      - name: Dependency state stays unchanged
        run: git diff --exit-code -- gradle/verification-metadata.xml '*gradle.lockfile'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: server-reports
          path: |
            engine/build/reports/
            engine/build/review/
            server/build/reports/
          retention-days: 7
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: npm run lint:api && npm run check:api && npm run lint && npm run knip && npm run test:coverage && npm run build
        working-directory: web
        env:
          GIT_SHA: ${{ github.sha }}
      - run: npm audit --audit-level=high
        working-directory: web
  dependency-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan locked build, test and runtime dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/astrid-locks/engine" "$RUNNER_TEMP/astrid-locks/server"
          cp ./*gradle.lockfile "$RUNNER_TEMP/astrid-locks/"
          cp engine/*gradle.lockfile "$RUNNER_TEMP/astrid-locks/engine/"
          cp server/*gradle.lockfile "$RUNNER_TEMP/astrid-locks/server/"
          docker run --rm -v "$RUNNER_TEMP/astrid-locks:/scan:ro" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --exit-code 1 --no-progress /scan
  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KUBECONFORM_SCHEMAS: 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/8df8a883b68a24a104b4a9e43c1288090ae60b3b/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified kubeconform
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tgz" https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP" kubeconform
      - run: '"$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.33.0 -schema-location "$KUBECONFORM_SCHEMAS" k8s/app.yaml k8s/postgres.yaml k8s/namespace.yaml k8s/configmap.yaml'
      - name: Validate the rendered private stack
        run: |
          kubectl kustomize k8s > "$RUNNER_TEMP/astrid-rendered.yaml"
          "$RUNNER_TEMP/kubeconform" -strict -summary -kubernetes-version 1.33.0 -schema-location "$KUBECONFORM_SCHEMAS" "$RUNNER_TEMP/astrid-rendered.yaml"
  image:
    runs-on: ubuntu-24.04
    # 372 journeys used 33m24s on run 42737593818; S04 adds both-browser cases.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build --build-arg ASTRID_UBUNTU_MIRROR=https://mirrors.edge.kernel.org/ubuntu/ -t astrid:local .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci && npm run lint && npm run knip && npm run typecheck && npm run check:scenarios && npm run test:scripts && npm audit --audit-level=high
        working-directory: e2e
      - name: Run the packaged browser journeys
        run: |
          docker compose --env-file .env.example up -d --wait
          scripts/run-browser-tests.sh
      - name: Capture stack diagnostics
        if: ${{ failure() }}
        run: docker compose --env-file .env.example logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: browser-reports
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: Scan packaged runtime
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress astrid:local
      - name: Stop private test stack
        if: ${{ always() }}
        run: docker compose --env-file .env.example down
