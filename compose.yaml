name: astrid
services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: astrid
      POSTGRES_USER: astrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrid -d astrid"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    image: astrid:local
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/astrid
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/astrid
      POSTGRES_USER: astrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      ASTRID_DEVELOPMENT_MODE: "true"
      ASTRID_ALLOWED_ORIGINS: http://localhost:8088,http://127.0.0.1:8088
      ASTRID_INSPECTOR_ENABLED: ${ASTRID_INSPECTOR_ENABLED:-false}
      ASTRID_INSPECTOR_KEY: ${ASTRID_INSPECTOR_KEY:-}
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  postgres-data:
