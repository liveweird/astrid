openapi: 3.0.3
info: { title: Astrid pilot API, version: 0.1.0 }
servers: [{ url: 'http://localhost:8088' }]
paths:
  /api/v1/development-session:
    post:
      operationId: createDevelopmentSession
      parameters: [{ $ref: '#/components/parameters/Client' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/DevelopmentSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /api/v1/catalog:
    get:
      operationId: getCatalog
      responses:
        '200': { description: Catalog, content: { application/json: { schema: { $ref: '#/components/schemas/Catalog' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/exercises:
    post:
      operationId: createExercise
      parameters: [{ $ref: '#/components/parameters/Client' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseRequest' } } } }
      responses:
        '201': { description: Exercise, content: { application/json: { schema: { $ref: '#/components/schemas/Exercise' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /api/v1/exercises/{id}:
    get:
      operationId: getExercise
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Exercise, content: { application/json: { schema: { $ref: '#/components/schemas/Exercise' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/attempts:
    post:
      operationId: submitAttempt
      parameters: [{ $ref: '#/components/parameters/Client' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptRequest' } } } }
      responses:
        '200': { description: Attempt, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/attempts/{id}:
    get:
      operationId: getAttempt
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Attempt, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-context:
    get:
      operationId: getPracticeContext
      responses:
        '200': { description: Practice context, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeContext' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-sessions:
    post:
      operationId: createPracticeSession
      parameters: [{ $ref: '#/components/parameters/Client' }, { $ref: '#/components/parameters/PracticeOwner' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSessionRequest' } } } }
      responses:
        '200': { description: Resumed practice session, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '201': { description: Created practice session, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-sessions/{id}:
    get:
      operationId: getPracticeSession
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Practice session, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-sessions/{id}/follow-ups:
    post:
      operationId: createPracticeFollowUp
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Client' }, { $ref: '#/components/parameters/PracticeOwner' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeFollowUpRequest' } } } }
      responses:
        '200': { description: Resumed follow-up practice, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '201': { description: Created follow-up practice, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-sessions/{id}/support:
    post:
      operationId: openPracticeSupport
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Client' }, { $ref: '#/components/parameters/PracticeOwner' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSupportRequest' } } } }
      responses:
        '200': { description: Practice session, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-sessions/{id}/advance:
    post:
      operationId: advancePracticeSession
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Client' }, { $ref: '#/components/parameters/PracticeOwner' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeAdvanceRequest' } } } }
      responses:
        '200': { description: Practice session, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
  /api/v1/dev/exercises/{id}:
    get:
      operationId: inspectExercise
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: X-Astrid-Inspector-Key, in: header, required: true, schema: { type: string, minLength: 32 } }
      responses:
        '200': { description: Inspector, content: { application/json: { schema: { $ref: '#/components/schemas/Inspector' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200': { description: Live, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/ready:
    get:
      operationId: getReadiness
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { description: Unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
components:
  parameters:
    Client: { name: X-Astrid-Client, in: header, required: true, schema: { type: string, enum: [playground] } }
    PracticeOwner: { name: X-Astrid-Practice-Owner, in: header, required: true, schema: { type: string, format: uuid } }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem: { description: Safe problem, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    DevelopmentSession:
      type: object
      additionalProperties: false
      required: [mode, inspectorEnabled, contentRevision, generatorRevision, evaluationRevision]
      properties:
        mode: { type: string, enum: [development] }
        inspectorEnabled: { type: boolean }
        contentRevision: { type: string, enum: [pilot-3] }
        generatorRevision: { type: string, enum: [generator-3] }
        evaluationRevision: { type: string, enum: [evaluation-3] }
    Catalog:
      type: object
      additionalProperties: false
      required: [contentRevision, generatorRevision, evaluationRevision, skills, formats, sentenceCount]
      properties:
        contentRevision: { type: string }
        generatorRevision: { type: string }
        evaluationRevision: { type: string }
        sentenceCount: { type: integer, enum: [99] }
        skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        formats: { type: array, items: { $ref: '#/components/schemas/Format' } }
    Skill:
      type: object
      additionalProperties: false
      required: [id, title, explanation, prerequisiteIds]
      properties:
        id: { type: string }
        title: { type: string }
        explanation: { type: string }
        prerequisiteIds: { type: array, items: { type: string } }
    Format:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        targetSkillId: { type: string, nullable: true }
        lexicalTask: { $ref: '#/components/schemas/LexicalTask' }
    LexicalTask:
      type: object
      additionalProperties: false
      required: [facet, direction]
      properties:
        facet: { type: string, enum: [meaning, singular-headword] }
        direction: { type: string, enum: [da-en, en-da] }
    ExerciseRequest:
      type: object
      additionalProperties: false
      required: [formatId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, maxLength: 32 }
        targetSkillId: { type: string, nullable: true, maxLength: 32 }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, maxLength: 64 }
        generatorRevision: { type: string, maxLength: 64 }
    Exercise:
      type: object
      additionalProperties: false
      required: [id, formatId, supportSkillIds, contentRevision, generatorRevision, instruction, context, prompt, introduction, hint]
      properties:
        id: { type: string, format: uuid }
        formatId: { type: string }
        targetSkillId: { type: string, nullable: true }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        supportSkillIds: { type: array, items: { type: string } }
        contentRevision: { type: string }
        generatorRevision: { type: string }
        instruction: { type: string }
        context: { type: string }
        prompt: { $ref: '#/components/schemas/Prompt' }
        introduction: { type: array, items: { $ref: '#/components/schemas/Introduction' } }
        hint: { type: string }
    LexicalTarget:
      type: object
      additionalProperties: false
      required: [entryId, senseId, facet, direction]
      properties:
        entryId: { type: string }
        senseId: { type: string }
        facet: { type: string, enum: [meaning, singular-headword] }
        direction: { type: string, enum: [da-en, en-da] }
    Prompt:
      type: object
      additionalProperties: false
      required: [before, after, choices, blocks, punctuation]
      properties:
        before: { type: string, description: Sentence content before the answer slot. }
        after: { type: string, description: Sentence content after the answer slot; includes final punctuation for text and choice exercises. }
        choices: { type: array, items: { type: string } }
        blocks: { type: array, items: { $ref: '#/components/schemas/Block' } }
        punctuation: { type: string, description: Supplied separately for the ordering exercise only. }
        inputLabel: { type: string, nullable: true, description: Label for the text entry field when the exercise needs one. }
        replacementWord: { type: string, nullable: true, description: 'Corrupted word to replace; this is context, not the answer.' }
        cue: { type: string, nullable: true, description: 'Vocabulary cue shown separately from sentence fragments.' }
        cueLanguage: { type: string, nullable: true, enum: [da, en] }
        answerLanguage: { type: string, nullable: true, enum: [da, en] }
    Block: { type: object, additionalProperties: false, required: [id, text], properties: { id: { type: string }, text: { type: string } } }
    Introduction: { type: object, additionalProperties: false, required: [title, body], properties: { title: { type: string }, body: { type: string } } }
    AttemptRequest:
      type: object
      additionalProperties: false
      required: [attemptId, exerciseId, answer, hintUsed]
      properties:
        attemptId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        answer:
          oneOf: [{ $ref: '#/components/schemas/TextAnswer' }, { $ref: '#/components/schemas/OrderAnswer' }]
        hintUsed: { type: boolean }
    TextAnswer:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: { type: string, enum: [text] }
        text:
          type: string
          maxLength: 512
          description: Must be well-formed Unicode. The maximum length is counted in Unicode code points.
    OrderAnswer:
      type: object
      additionalProperties: false
      required: [kind, blockIds]
      properties:
        kind: { type: string, enum: [order] }
        blockIds: { type: array, maxItems: 16, items: { type: string, maxLength: 64 } }
    Attempt:
      type: object
      additionalProperties: false
      required: [attemptId, exerciseId, targetSatisfaction, linguisticStatus, issues, feedback, completedSentence, evaluationRevision, hintUsed, retryNumber, createdAt]
      properties:
        attemptId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        targetSatisfaction: { type: string, enum: [met, not-met, unevaluable] }
        linguisticStatus: { type: string, enum: [acceptable, known-issue, unknown] }
        linguisticScope: { type: string, nullable: true, enum: [english-choice, danish-headword] }
        responseConstraintStatus: { type: string, nullable: true, enum: [met, not-met] }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        feedback: { type: string }
        completedSentence: { type: string }
        evaluationRevision: { type: string }
        hintUsed: { type: boolean }
        retryNumber: { type: integer, minimum: 1 }
        createdAt: { type: integer, format: int64 }
    Issue: { type: object, additionalProperties: false, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
    PracticeContext:
      type: object
      additionalProperties: false
      required: [ownerSessionId, sessionExpiresAt, focusId, title, planRevision, itemCount]
      properties:
        ownerSessionId: { type: string, format: uuid }
        sessionExpiresAt: { type: integer, format: int64 }
        focusId: { type: string, enum: [reading-basics] }
        title: { type: string }
        planRevision: { type: string, enum: [practice-1] }
        itemCount: { type: integer, enum: [8] }
    PracticeSessionRequest:
      type: object
      additionalProperties: false
      required: [practiceSessionId, focusId, planRevision, seed]
      properties:
        practiceSessionId: { type: string, format: uuid }
        focusId: { type: string, enum: [reading-basics] }
        planRevision: { type: string, enum: [practice-1] }
        seed: { type: integer, minimum: 0 }
    PracticeSupportRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [introduction, lesson, hint] }
        position: { type: integer, minimum: 0, maximum: 7 }
    PracticeFollowUpRequest:
      type: object
      additionalProperties: false
      required: [practiceSessionId, planRevision, seed, targetKeys]
      properties:
        practiceSessionId: { type: string, format: uuid }
        planRevision: { type: string, enum: [follow-up-1] }
        seed: { type: integer, minimum: 0 }
        targetKeys: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 160 } }
    PracticeAdvanceRequest:
      type: object
      additionalProperties: false
      required: [position]
      properties:
        position: { type: integer, minimum: 0, maximum: 7 }
    PracticeSession:
      type: object
      additionalProperties: false
      required: [id, ownerSessionId, focusId, title, planRevision, seed, contentRevision, generatorRevision, evaluationRevision, sessionExpiresAt, state, cursor, itemCount, prerequisiteSkillIds, introduction, introductionOpened, items, summary]
      properties:
        id: { type: string, format: uuid }
        ownerSessionId: { type: string, format: uuid }
        focusId: { type: string }
        title: { type: string }
        planRevision: { type: string }
        seed: { type: integer }
        contentRevision: { type: string }
        generatorRevision: { type: string }
        evaluationRevision: { type: string }
        sessionExpiresAt: { type: integer, format: int64 }
        state: { type: string, enum: [active, completed] }
        cursor: { type: integer, minimum: 0, maximum: 8 }
        itemCount: { type: integer, minimum: 1, maximum: 8 }
        prerequisiteSkillIds: { type: array, items: { type: string } }
        introduction: { type: array, items: { $ref: '#/components/schemas/Introduction' } }
        introductionOpened: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/PracticeItem' } }
        currentExercise: { $ref: '#/components/schemas/Exercise' }
        summary: { $ref: '#/components/schemas/PracticeSummary' }
        followUp: { $ref: '#/components/schemas/PracticeFollowUp' }
    PracticeFollowUp:
      type: object
      additionalProperties: false
      required: [sourcePracticeSessionId, selectedTargetKeys]
      properties:
        sourcePracticeSessionId: { type: string, format: uuid }
        selectedTargetKeys: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string } }
    PracticeItem:
      type: object
      additionalProperties: false
      required: [position, exerciseId, formatId, lessonOpened, hintOpened, attemptIds, attemptCount]
      properties:
        position: { type: integer }
        exerciseId: { type: string, format: uuid }
        formatId: { type: string }
        targetSkillId: { type: string, nullable: true }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        lessonOpened: { type: boolean }
        hintOpened: { type: boolean }
        attemptIds: { type: array, items: { type: string, format: uuid } }
        attemptCount: { type: integer, minimum: 0 }
        firstAttempt: { $ref: '#/components/schemas/Attempt' }
        lastAttempt: { $ref: '#/components/schemas/Attempt' }
        firstAnswer:
          oneOf: [{ $ref: '#/components/schemas/TextAnswer' }, { $ref: '#/components/schemas/OrderAnswer' }]
        lastAnswer:
          oneOf: [{ $ref: '#/components/schemas/TextAnswer' }, { $ref: '#/components/schemas/OrderAnswer' }]
        firstAttemptContext: { $ref: '#/components/schemas/PracticeAttemptContext' }
        lastAttemptContext: { $ref: '#/components/schemas/PracticeAttemptContext' }
    PracticeAttemptContext:
      type: object
      additionalProperties: false
      required: [introductionOpened, lessonOpened, hintOpened, priorExposure]
      properties:
        introductionOpened: { type: boolean }
        lessonOpened: { type: boolean }
        hintOpened: { type: boolean }
        priorExposure: { type: array, items: { $ref: '#/components/schemas/PracticePriorExposure' } }
        sourceExposure: { type: array, items: { $ref: '#/components/schemas/PracticeCrossRunExposure' } }
    PracticePriorExposure:
      type: object
      additionalProperties: false
      required: [position, source, keys]
      properties:
        position: { type: integer }
        source: { type: string, enum: [prompt, lesson, hint, feedback] }
        keys: { type: array, items: { type: string } }
    PracticeCrossRunExposure:
      type: object
      additionalProperties: false
      required: [practiceSessionId, position, source, keys]
      properties:
        practiceSessionId: { type: string, format: uuid }
        position: { type: integer, minimum: -1, maximum: 7 }
        source: { type: string, enum: [introduction, prompt, lesson, hint, feedback] }
        keys: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
    PracticeSummary:
      type: object
      additionalProperties: false
      required: [plannedItems, attemptedItems, completedItems, attemptCount, retryCount, introductionOpened, rows]
      properties:
        plannedItems: { type: integer }
        attemptedItems: { type: integer }
        completedItems: { type: integer }
        attemptCount: { type: integer }
        retryCount: { type: integer }
        introductionOpened: { type: boolean }
        rows: { type: array, items: { $ref: '#/components/schemas/PracticeSummaryRow' } }
    PracticeSummaryRow:
      type: object
      additionalProperties: false
      required: [label, plannedItems, attemptedItems, advancedItems, attemptCount, retryCount, firstOutcomes, latestOutcomes, firstWithSupport, firstWithPriorExposure, lessonOpenedItems, hintOpenedItems]
      properties:
        label: { type: string }
        targetSkillId: { type: string, nullable: true }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        plannedItems: { type: integer }
        attemptedItems: { type: integer }
        advancedItems: { type: integer }
        attemptCount: { type: integer }
        retryCount: { type: integer }
        firstOutcomes: { $ref: '#/components/schemas/PracticeOutcomeCounts' }
        latestOutcomes: { $ref: '#/components/schemas/PracticeOutcomeCounts' }
        firstWithSupport: { type: integer }
        firstWithPriorExposure: { type: integer }
        lessonOpenedItems: { type: integer }
        hintOpenedItems: { type: integer }
    PracticeOutcomeCounts:
      type: object
      additionalProperties: false
      required: [fullyMet, targetMet, targetNotMet, unevaluable, languageUnknown, languageKnownIssue, responseConstraintNotMet]
      properties:
        fullyMet: { type: integer }
        targetMet: { type: integer }
        targetNotMet: { type: integer }
        unevaluable: { type: integer }
        languageUnknown: { type: integer }
        languageKnownIssue: { type: integer }
        responseConstraintNotMet: { type: integer }
    Inspector:
      type: object
      additionalProperties: false
      required: [exercise, seed, index, lexicalIds, clauseRoles]
      properties:
        exercise: { $ref: '#/components/schemas/Exercise' }
        seed: { type: integer }
        index: { type: integer }
        canonicalSentenceId: { type: string, nullable: true }
        constructionId: { type: string, nullable: true }
        lexicalIds: { type: array, items: { type: string } }
        clauseRoles: { type: array, items: { type: string } }
        canonicalSentence: { type: string, nullable: true }
        lexicalSource: { $ref: '#/components/schemas/LexicalSource' }
    LexicalSource:
      type: object
      additionalProperties: false
