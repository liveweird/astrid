      allOf: [{ $ref: '#/components/schemas/GapSelection' }, { type: object, properties: { slotId: { type: string, enum: [g1] }, choiceId: { type: string, enum: [c1] } } }]
    GapAssignmentC0C0: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/GapSelectionG0C0' }, { $ref: '#/components/schemas/GapSelectionG1C0' }] } }
    GapAssignmentC0C1: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/GapSelectionG0C0' }, { $ref: '#/components/schemas/GapSelectionG1C1' }] } }
    GapAssignmentC1C0: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/GapSelectionG0C1' }, { $ref: '#/components/schemas/GapSelectionG1C0' }] } }
    GapAssignmentC1C1: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/GapSelectionG0C1' }, { $ref: '#/components/schemas/GapSelectionG1C1' }] } }
    MatchingPair:
      type: object
      additionalProperties: false
      required: [leftId, rightId]
      properties:
        leftId: { type: string, enum: [l0, l1, l2, l3] }
        rightId: { type: string, enum: [r0, r1, r2, r3] }
    MatchingPairL0R0: &MatchingPairL0R0
