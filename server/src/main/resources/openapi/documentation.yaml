        - { $ref: '#/components/schemas/MatchingPair' }
        - { type: object, properties: { leftId: { type: string, enum: [l1] }, rightId: { type: string, enum: [r0] } } }
    MatchingPairL1R1: &MatchingPairL1R1
      allOf:
        - { $ref: '#/components/schemas/MatchingPair' }
        - { type: object, properties: { leftId: { type: string, enum: [l1] }, rightId: { type: string, enum: [r1] } } }
    MatchingPairL1R2: &MatchingPairL1R2
