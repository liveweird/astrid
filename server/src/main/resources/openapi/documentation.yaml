    Attempt:
      oneOf:
        - { $ref: '#/components/schemas/NonMatchingAttempt' }
        - { $ref: '#/components/schemas/MatchingAttempt' }
        - { $ref: '#/components/schemas/GapAttempt' }
    NonMatchingAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, exerciseId, targetSatisfaction, linguisticStatus, issues, feedback, completedSentence, evaluationRevision, hintUsed, retryNumber, createdAt]
      not: { anyOf: [{ required: [matchingResults] }, { required: [gapResults] }] }
      properties:
        attemptId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        targetSatisfaction: { type: string, enum: [met, not-met, unevaluable] }
        linguisticStatus: { type: string, enum: [acceptable, known-issue, unknown] }
        linguisticScope: { type: string, nullable: true, enum: [english-choice, danish-choice, danish-headword, danish-sentence, danish-word-form] }
        responseConstraintStatus: { type: string, nullable: true, enum: [met, not-met] }
        meaningSatisfaction: { type: string, nullable: true, enum: [met, not-met, unknown] }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        feedback: { type: string }
        completedSentence: { type: string }
        evaluationRevision: { type: string }
        hintUsed: { type: boolean }
        retryNumber: { type: integer, minimum: 1 }
        createdAt: { type: integer, format: int64 }
    MatchingAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, exerciseId, targetSatisfaction, linguisticStatus, linguisticScope, responseConstraintStatus, meaningSatisfaction, matchingResults, issues, feedback, completedSentence, evaluationRevision, hintUsed, retryNumber, createdAt]
      properties:
        attemptId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        targetSatisfaction: { type: string, enum: [met, not-met, unevaluable] }
        linguisticStatus: { type: string, enum: [acceptable, unknown] }
        linguisticScope: { type: string, enum: [danish-matching] }
        responseConstraintStatus: { type: string, enum: [met, not-met] }
        meaningSatisfaction: { type: string, enum: [met, not-met, unknown] }
        matchingResults: { type: array, minItems: 3, maxItems: 4, items: { $ref: '#/components/schemas/MatchingPairResult' } }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        feedback: { type: string }
        completedSentence: { type: string, maxLength: 0 }
        evaluationRevision: { type: string, enum: [evaluation-6, evaluation-7, evaluation-8, evaluation-9, evaluation-10, evaluation-11, evaluation-12, evaluation-13, evaluation-14, evaluation-15, evaluation-16, evaluation-17, evaluation-18] }
        hintUsed: { type: boolean }
        retryNumber: { type: integer, minimum: 1 }
        createdAt: { type: integer, format: int64 }
    MatchingPairResult:
      oneOf:
        - { $ref: '#/components/schemas/CorrectMatchingPairResult' }
        - { $ref: '#/components/schemas/WrongMatchingPairResult' }
        - { $ref: '#/components/schemas/UnmatchedMatchingPairResult' }
        - { $ref: '#/components/schemas/VocabularyCorrectMatchingPairResult' }
        - { $ref: '#/components/schemas/VocabularyWrongMatchingPairResult' }
        - { $ref: '#/components/schemas/VocabularyUnmatchedMatchingPairResult' }
    CorrectMatchingPairResult: &SelectedMatchingPairResult
      type: object
      additionalProperties: false
      required: [leftId, rightId, lexicalTarget, targetSatisfaction, meaningSatisfaction, responseConstraintStatus, linguisticStatus, feedback]
      properties: &SelectedMatchingPairResultProperties
        leftId: { type: string, enum: [l0, l1, l2, l3] }
        rightId: { type: string, enum: [r0, r1, r2, r3] }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        targetSatisfaction: { type: string, enum: [met] }
        meaningSatisfaction: { type: string, enum: [met] }
        responseConstraintStatus: { type: string, enum: [met] }
        linguisticStatus: { type: string, enum: [acceptable] }
        feedback: { type: string }
    WrongMatchingPairResult:
      <<: *SelectedMatchingPairResult
      properties:
        <<: *SelectedMatchingPairResultProperties
        targetSatisfaction: { type: string, enum: [not-met] }
        meaningSatisfaction: { type: string, enum: [not-met] }
    UnmatchedMatchingPairResult:
      type: object
      additionalProperties: false
      required: [leftId, lexicalTarget, targetSatisfaction, meaningSatisfaction, responseConstraintStatus, linguisticStatus, feedback]
      not: { required: [rightId] }
      properties:
        leftId: { type: string, enum: [l0, l1, l2, l3] }
        rightId: { type: string, enum: [r0, r1, r2, r3] }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        targetSatisfaction: { type: string, enum: [unevaluable] }
        meaningSatisfaction: { type: string, enum: [unknown] }
        responseConstraintStatus: { type: string, enum: [not-met] }
        linguisticStatus: { type: string, enum: [unknown] }
        feedback: { type: string }
    VocabularyCorrectMatchingPairResult: &VocabularySelectedMatchingPairResult
      type: object
      additionalProperties: false
      required: [leftId, rightId, lexicalTarget, targetSatisfaction, meaningSatisfaction, responseConstraintStatus, linguisticStatus, feedback]
      properties: &VocabularySelectedMatchingPairResultProperties
        leftId: { type: string, pattern: '^m-[0-9a-z]+$' }
        rightId: { type: string, pattern: '^n-[0-9a-z]+$' }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        targetSatisfaction: { type: string, enum: [met] }
        meaningSatisfaction: { type: string, enum: [met] }
        responseConstraintStatus: { type: string, enum: [met] }
        linguisticStatus: { type: string, enum: [acceptable] }
        feedback: { type: string }
    VocabularyWrongMatchingPairResult:
      <<: *VocabularySelectedMatchingPairResult
      properties:
        <<: *VocabularySelectedMatchingPairResultProperties
        targetSatisfaction: { type: string, enum: [not-met] }
        meaningSatisfaction: { type: string, enum: [not-met] }
    VocabularyUnmatchedMatchingPairResult:
      type: object
      additionalProperties: false
      required: [leftId, lexicalTarget, targetSatisfaction, meaningSatisfaction, responseConstraintStatus, linguisticStatus, feedback]
      not: { required: [rightId] }
      properties:
        leftId: { type: string, pattern: '^m-[0-9a-z]+$' }
        rightId: { type: string, pattern: '^n-[0-9a-z]+$' }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        targetSatisfaction: { type: string, enum: [unevaluable] }
        meaningSatisfaction: { type: string, enum: [unknown] }
        responseConstraintStatus: { type: string, enum: [not-met] }
        linguisticStatus: { type: string, enum: [unknown] }
        feedback: { type: string }
    GapAttempt:
      oneOf:
        - { $ref: '#/components/schemas/GapAttemptUnevaluableUnknown' }
        - { $ref: '#/components/schemas/GapAttemptUnevaluableKnownIssue' }
        - { $ref: '#/components/schemas/GapAttemptMetIncomplete' }
        - { $ref: '#/components/schemas/GapAttemptMetComplete' }
        - { $ref: '#/components/schemas/GapAttemptMetKnownIssue' }
        - { $ref: '#/components/schemas/GapAttemptNotMetIncomplete' }
        - { $ref: '#/components/schemas/GapAttemptNotMetComplete' }
    GapAttemptUnevaluableUnknown: &GapAttemptObject
      type: object
      additionalProperties: false
      required: [attemptId, exerciseId, targetSatisfaction, linguisticStatus, linguisticScope, responseConstraintStatus, gapResults, issues, feedback, completedSentence, evaluationRevision, hintUsed, retryNumber, createdAt]
      properties: &GapAttemptProperties
        attemptId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        targetSatisfaction: { type: string, enum: [unevaluable] }
        linguisticStatus: { type: string, enum: [unknown] }
        linguisticScope: { type: string, enum: [danish-gaps] }
        responseConstraintStatus: { type: string, enum: [not-met] }
        gapResults:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          description: Rows appear exactly once each in displayed slot order g0, g1; generation and HTTP tests enforce identity and order.
          items: { $ref: '#/components/schemas/GapResult' }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        feedback: { type: string }
        completedSentence: { type: string }
        evaluationRevision: { type: string, enum: [evaluation-7, evaluation-8, evaluation-9, evaluation-10, evaluation-11, evaluation-12, evaluation-13, evaluation-14, evaluation-15, evaluation-16, evaluation-17, evaluation-18] }
        hintUsed: { type: boolean }
        retryNumber: { type: integer, minimum: 1 }
        createdAt: { type: integer, format: int64 }
    GapAttemptUnevaluableKnownIssue:
      <<: *GapAttemptObject
      properties:
        <<: *GapAttemptProperties
        linguisticStatus: { type: string, enum: [known-issue] }
    GapAttemptMetIncomplete:
      <<: *GapAttemptObject
      properties:
        <<: *GapAttemptProperties
        targetSatisfaction: { type: string, enum: [met] }
    GapAttemptMetComplete:
      <<: *GapAttemptObject
      properties:
        <<: *GapAttemptProperties
        targetSatisfaction: { type: string, enum: [met] }
        responseConstraintStatus: { type: string, enum: [met] }
        linguisticStatus: { type: string, enum: [acceptable] }
    GapAttemptMetKnownIssue:
      <<: *GapAttemptObject
      properties:
        <<: *GapAttemptProperties
        targetSatisfaction: { type: string, enum: [met] }
        responseConstraintStatus: { type: string, enum: [met] }
        linguisticStatus: { type: string, enum: [known-issue] }
    GapAttemptNotMetIncomplete:
      <<: *GapAttemptObject
      properties:
        <<: *GapAttemptProperties
        targetSatisfaction: { type: string, enum: [not-met] }
        linguisticStatus: { type: string, enum: [known-issue] }
    GapAttemptNotMetComplete:
      <<: *GapAttemptObject
      properties:
        <<: *GapAttemptProperties
        targetSatisfaction: { type: string, enum: [not-met] }
        responseConstraintStatus: { type: string, enum: [met] }
        linguisticStatus: { type: string, enum: [known-issue] }
