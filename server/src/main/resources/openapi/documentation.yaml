        taskId: { type: string }
        modalEntryId: { type: string, enum: [L034, L035, L036] }
        modalSenseId: { type: string, enum: [L034-S01, L035-S01, L036-S01] }
        expectedInterpretation: { type: string }
        frameVariantId: { type: string }
        contextVariantId: { type: string }
    VocabularyExerciseSource:
      type: object
      additionalProperties: false
      required: [taskId, operation, lexicalSources, suppliedChoices, supportFacts, matchingPairs, tileOccurrences, acceptedOrders, knownAlternatives, reviewedOrders]
      properties:
        taskId: { type: string }
        operation: { type: string, enum: [E031, E032, E033, E034, E035, E036, E037, E038, E039] }
        lexicalSources: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/VocabularyLexicalSource' } }
