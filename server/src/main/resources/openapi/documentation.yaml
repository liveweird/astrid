        suppliedChoices: { type: array, items: { type: string } }
        supportFacts: { type: array, items: { $ref: '#/components/schemas/VocabularySupportFact' } }
        matchingPairs: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/VocabularyMatchingPairSource' } }
        tileOccurrences: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/VocabularyTileOccurrence' } }
        acceptedOrders: { type: array, maxItems: 2, items: { type: array, items: { type: string } } }
        targetSupportFactId: { type: string }
        questionRole: { type: string, enum: [object, place, time] }
        normalizationPolicy: { type: string }
        knownAlternatives: { type: array, items: { $ref: '#/components/schemas/VocabularyKnownAlternative' } }
        reviewedOrders: { type: array, items: { $ref: '#/components/schemas/VocabularyReviewedOrder' } }
