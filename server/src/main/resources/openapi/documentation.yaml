    PracticePriorExposure:
      oneOf:
        - { type: object, additionalProperties: false, required: [position, source, keys], properties: { position: { type: integer, enum: [-1] }, source: { type: string, enum: [introduction] }, keys: { type: array, items: { type: string } } } }
        - { type: object, additionalProperties: false, required: [position, source, keys], properties: { position: { type: integer, minimum: 0, maximum: 7 }, source: { type: string, enum: [prompt, lesson, hint, feedback] }, keys: { type: array, items: { type: string } } } }
    PracticeCrossRunExposure:
      oneOf:
        - { type: object, additionalProperties: false, required: [practiceSessionId, position, source, keys], properties: { practiceSessionId: { type: string, format: uuid }, position: { type: integer, enum: [-1] }, source: { type: string, enum: [introduction] }, keys: { type: array, minItems: 1, uniqueItems: true, items: { type: string } } } }
        - { type: object, additionalProperties: false, required: [practiceSessionId, position, source, keys], properties: { practiceSessionId: { type: string, format: uuid }, position: { type: integer, minimum: 0, maximum: 7 }, source: { type: string, enum: [prompt, lesson, hint, feedback] }, keys: { type: array, minItems: 1, uniqueItems: true, items: { type: string } } } }
    PracticeSummary:
      type: object
      additionalProperties: false
      required: [plannedItems, attemptedItems, completedItems, attemptCount, retryCount, introductionOpened, rows]
      properties:
        plannedItems: { type: integer }
        attemptedItems: { type: integer }
        completedItems: { type: integer }
        attemptCount: { type: integer }
        retryCount: { type: integer }
        introductionOpened: { type: boolean }
        rows: { type: array, items: { $ref: '#/components/schemas/PracticeSummaryRow' } }
    PracticeSummaryRow:
      type: object
      additionalProperties: false
      required: [label, plannedItems, attemptedItems, advancedItems, attemptCount, retryCount, firstOutcomes, latestOutcomes, firstWithSupport, firstWithPriorExposure, lessonOpenedItems, hintOpenedItems]
      properties:
        label: { type: string }
        targetSkillId: { type: string, nullable: true }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        assessmentMode: { type: string, enum: [selection, recall, repair, constituent-order, word-order, matching] }
        assessmentRole: { type: string, enum: [primary, support] }
        targetScopeId: { type: string, enum: [human-singular, human-group, vaere-present, inanimate-singular-subject, named-three-verbs-present, subject-first-supplied, have-possession-present, personal-introduction-present, kan-bare-infinitive, modal-volition-meaning, modal-obligation-meaning, modal-permission-meaning, supplied-modal-order, one-final-circumstance, neutral-positive-yes-no, p1-studere-present, p1-drikke-present, p1-subject-first-supplied] }
        readingTarget: { $ref: '#/components/schemas/ReadingTask' }
        readingRole: { type: string, enum: [object, place, time] }
        matchingTarget: { $ref: '#/components/schemas/LexicalTask' }
        plannedItems: { type: integer }
        attemptedItems: { type: integer }
        advancedItems: { type: integer }
        attemptCount: { type: integer }
        retryCount: { type: integer }
        firstOutcomes: { $ref: '#/components/schemas/PracticeOutcomeCounts' }
        latestOutcomes: { $ref: '#/components/schemas/PracticeOutcomeCounts' }
        firstWithSupport: { type: integer }
        firstWithPriorExposure: { type: integer }
        lessonOpenedItems: { type: integer }
        hintOpenedItems: { type: integer }
