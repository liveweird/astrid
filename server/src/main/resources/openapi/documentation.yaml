openapi: 3.0.3
info: { title: Astrid pilot API, version: 0.4.0 }
servers: [{ url: 'http://localhost:8088' }]
# Every operation needs the development session cookie except the three that declare `security: []`.
security:
  - developmentSession: []
paths:
  /api/v1/development-session:
    post:
      operationId: createDevelopmentSession
      security: []
      parameters: [{ $ref: '#/components/parameters/Client' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/DevelopmentSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/catalog:
    get:
      operationId: getCatalog
      responses:
        '200': { description: Catalog, content: { application/json: { schema: { $ref: '#/components/schemas/Catalog' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/exercises:
    post:
      operationId: createExercise
      parameters: [{ $ref: '#/components/parameters/Client' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExerciseRequest' } } } }
      responses:
        '201':
          description: Created exercise; `Location` points at it
          headers:
            Location:
              schema: { type: string }
          content: { application/json: { schema: { $ref: '#/components/schemas/Exercise' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/exercises/{id}:
    get:
      operationId: getExercise
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Exercise, content: { application/json: { schema: { $ref: '#/components/schemas/Exercise' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/attempts:
    post:
      operationId: submitAttempt
      parameters: [{ $ref: '#/components/parameters/Client' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttemptRequest' } } } }
      responses:
        '200': { description: Attempt, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/attempts/{id}:
    get:
      operationId: getAttempt
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Attempt, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-context:
    get:
      operationId: getPracticeContext
      responses:
        '200': { description: Practice context, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeContext' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-profiles:
    get:
      operationId: getPracticeProfiles
      responses:
        '200': { description: Available practice profiles, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeProfiles' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-sessions:
    post:
      operationId: createPracticeSession
      parameters: [{ $ref: '#/components/parameters/Client' }, { $ref: '#/components/parameters/PracticeOwner' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSessionRequest' } } } }
      responses:
        '200': { description: Resumed practice session, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '201':
          description: Created practice session; `Location` points at it
          headers:
            Location:
              schema: { type: string }
          content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-sessions/{id}:
    get:
      operationId: getPracticeSession
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Practice session, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-sessions/{id}/follow-ups:
    post:
      operationId: createPracticeFollowUp
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Client' }, { $ref: '#/components/parameters/PracticeOwner' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeFollowUpRequest' } } } }
      responses:
        '200': { description: Resumed follow-up practice, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '201':
          description: Created follow-up practice; `Location` points at it
          headers:
            Location:
              schema: { type: string }
          content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-sessions/{id}/support:
    post:
      operationId: openPracticeSupport
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Client' }, { $ref: '#/components/parameters/PracticeOwner' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSupportRequest' } } } }
      responses:
        '200': { description: Practice session, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/practice-sessions/{id}/advance:
    post:
      operationId: advancePracticeSession
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Client' }, { $ref: '#/components/parameters/PracticeOwner' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeAdvanceRequest' } } } }
      responses:
        '200': { description: Practice session, content: { application/json: { schema: { $ref: '#/components/schemas/PracticeSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/dev/exercises/{id}:
    get:
      operationId: inspectExercise
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: X-Astrid-Inspector-Key, in: header, required: true, schema: { type: string, minLength: 32 } }
      responses:
        '200': { description: Inspector, content: { application/json: { schema: { $ref: '#/components/schemas/Inspector' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200': { description: Live, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    developmentSession:
      type: apiKey
      in: cookie
      name: astrid_session
      description: Development session cookie issued by `POST /api/v1/development-session`
  parameters:
    Client: { name: X-Astrid-Client, in: header, required: true, schema: { type: string, enum: [playground] } }
    PracticeOwner: { name: X-Astrid-Practice-Owner, in: header, required: true, schema: { type: string, format: uuid } }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem: { description: Safe problem, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  schemas:
    DevelopmentSession:
      type: object
      additionalProperties: false
      required: [mode, inspectorEnabled, contentRevision, generatorRevision, evaluationRevision]
      properties:
        mode: { type: string, enum: [development] }
        inspectorEnabled: { type: boolean }
        contentRevision: { type: string, enum: [pilot-4] }
        generatorRevision: { type: string, enum: [generator-4] }
        evaluationRevision: { type: string, enum: [evaluation-4] }
    Catalog:
      type: object
      additionalProperties: false
      required: [contentRevision, generatorRevision, evaluationRevision, skills, formats, sentenceCount]
      properties:
        contentRevision: { type: string }
        generatorRevision: { type: string }
        evaluationRevision: { type: string }
        sentenceCount: { type: integer, enum: [99] }
        skills: { type: array, items: { $ref: '#/components/schemas/Skill' } }
        formats: { type: array, items: { $ref: '#/components/schemas/Format' } }
    Skill:
      type: object
      additionalProperties: false
      required: [id, title, explanation, prerequisiteIds]
      properties:
        id: { type: string }
        title: { type: string }
        explanation: { type: string }
        prerequisiteIds: { type: array, items: { type: string } }
    Format:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id: { type: string, enum: [E001, E002, E003, E004, E005, E006, E007, E008, E009, E010] }
        title: { type: string }
        targetSkillId: { type: string, nullable: true }
        lexicalTask: { $ref: '#/components/schemas/LexicalTask' }
        readingTask: { $ref: '#/components/schemas/ReadingTask' }
    LexicalTask:
      type: object
      additionalProperties: false
      required: [facet, direction]
      properties:
        facet: { type: string, enum: [meaning, singular-headword] }
        direction: { type: string, enum: [da-en, en-da] }
    ReadingTask:
      type: object
      additionalProperties: false
      required: [facet]
      properties:
        facet: { type: string, enum: [participant-action-complement] }
    ExerciseRequest:
      oneOf:
        - { $ref: '#/components/schemas/PairOnePresentRequest' }
        - { $ref: '#/components/schemas/PairOneArticleRequest' }
        - { $ref: '#/components/schemas/PairOneOrderRequest' }
        - { $ref: '#/components/schemas/PairTwoPresentRequest' }
        - { $ref: '#/components/schemas/PairTwoArticleRequest' }
        - { $ref: '#/components/schemas/PairTwoOrderRequest' }
        - { $ref: '#/components/schemas/PairThreePresentRequest' }
        - { $ref: '#/components/schemas/PairThreeArticleRequest' }
        - { $ref: '#/components/schemas/PairThreeOrderRequest' }
        - { $ref: '#/components/schemas/PairThreeLexicalRequest' }
        - { $ref: '#/components/schemas/PairFourPresentRequest' }
        - { $ref: '#/components/schemas/PairFourArticleRequest' }
        - { $ref: '#/components/schemas/PairFourOrderRequest' }
        - { $ref: '#/components/schemas/PairFourLexicalRequest' }
        - { $ref: '#/components/schemas/PairFourReadingRequest' }
    PairOnePresentRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E001] }
        targetSkillId: { type: string, enum: [G004] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-1] }
        generatorRevision: { type: string, enum: [generator-1] }
    PairOneArticleRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E002] }
        targetSkillId: { type: string, enum: [G006] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-1] }
        generatorRevision: { type: string, enum: [generator-1] }
    PairOneOrderRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E003] }
        targetSkillId: { type: string, enum: [G005] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-1] }
        generatorRevision: { type: string, enum: [generator-1] }
    PairTwoPresentRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E001, E004, E005] }
        targetSkillId: { type: string, enum: [G004] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-2] }
        generatorRevision: { type: string, enum: [generator-2] }
    PairTwoArticleRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E002, E006] }
        targetSkillId: { type: string, enum: [G006] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-2] }
        generatorRevision: { type: string, enum: [generator-2] }
    PairTwoOrderRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E003] }
        targetSkillId: { type: string, enum: [G005] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-2] }
        generatorRevision: { type: string, enum: [generator-2] }
    PairThreePresentRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E001, E004, E005] }
        targetSkillId: { type: string, enum: [G004] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-3] }
        generatorRevision: { type: string, enum: [generator-3] }
    PairThreeArticleRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E002, E006] }
        targetSkillId: { type: string, enum: [G006] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-3] }
        generatorRevision: { type: string, enum: [generator-3] }
    PairThreeOrderRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E003] }
        targetSkillId: { type: string, enum: [G005] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-3] }
        generatorRevision: { type: string, enum: [generator-3] }
    PairThreeLexicalRequest:
      type: object
      additionalProperties: false
      required: [formatId, seed, index, contentRevision, generatorRevision]
      not: { required: [targetSkillId] }
      properties:
        formatId: { type: string, enum: [E007, E008] }
        targetSkillId: { type: string, nullable: true, maxLength: 32 }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-3] }
        generatorRevision: { type: string, enum: [generator-3] }
    PairFourPresentRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E001, E004, E005] }
        targetSkillId: { type: string, enum: [G004] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-4] }
        generatorRevision: { type: string, enum: [generator-4] }
    PairFourArticleRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E002, E006] }
        targetSkillId: { type: string, enum: [G006] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-4] }
        generatorRevision: { type: string, enum: [generator-4] }
    PairFourOrderRequest:
      type: object
      additionalProperties: false
      required: [formatId, targetSkillId, seed, index, contentRevision, generatorRevision]
      properties:
        formatId: { type: string, enum: [E003, E009] }
        targetSkillId: { type: string, enum: [G005] }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-4] }
        generatorRevision: { type: string, enum: [generator-4] }
    PairFourLexicalRequest:
      type: object
      additionalProperties: false
      required: [formatId, seed, index, contentRevision, generatorRevision]
      not: { required: [targetSkillId] }
      properties:
        formatId: { type: string, enum: [E007, E008] }
        targetSkillId: { type: string, nullable: true, maxLength: 32 }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-4] }
        generatorRevision: { type: string, enum: [generator-4] }
    PairFourReadingRequest:
      type: object
      additionalProperties: false
      required: [formatId, seed, index, contentRevision, generatorRevision]
      not: { required: [targetSkillId] }
      properties:
        formatId: { type: string, enum: [E010] }
        targetSkillId: { type: string, nullable: true, maxLength: 32 }
        seed: { type: integer, minimum: 0 }
        index: { type: integer, minimum: 0, maximum: 1000000 }
        contentRevision: { type: string, enum: [pilot-4] }
        generatorRevision: { type: string, enum: [generator-4] }
    Exercise:
      oneOf:
        - { $ref: '#/components/schemas/GrammarExercise' }
        - { $ref: '#/components/schemas/LexicalExercise' }
        - { $ref: '#/components/schemas/WritingExercise' }
        - { $ref: '#/components/schemas/ReadingExercise' }
    GrammarExercise:
      oneOf:
        - { $ref: '#/components/schemas/PairOnePresentExerciseObject' }
        - { $ref: '#/components/schemas/PairOneArticleExerciseObject' }
        - { $ref: '#/components/schemas/PairOneOrderExerciseObject' }
        - { $ref: '#/components/schemas/PairTwoPresentExerciseObject' }
        - { $ref: '#/components/schemas/PairTwoArticleExerciseObject' }
        - { $ref: '#/components/schemas/PairTwoOrderExerciseObject' }
        - { $ref: '#/components/schemas/PairThreePresentExerciseObject' }
        - { $ref: '#/components/schemas/PairThreeArticleExerciseObject' }
        - { $ref: '#/components/schemas/PairThreeOrderExerciseObject' }
        - { $ref: '#/components/schemas/PairFourPresentExerciseObject' }
        - { $ref: '#/components/schemas/PairFourArticleExerciseObject' }
        - { $ref: '#/components/schemas/PairFourOrderExerciseObject' }
    PairOnePresentExerciseObject: &GrammarPresentPairOne
      type: object
      additionalProperties: false
      required: [id, formatId, targetSkillId, supportSkillIds, contentRevision, generatorRevision, instruction, context, prompt, introduction, hint]
      not: { anyOf: [{ required: [lexicalTarget] }, { required: [readingTarget] }] }
      properties: &GrammarPresentPairOneProperties
        id: { type: string, format: uuid }
        formatId: { type: string, enum: [E001] }
        targetSkillId: { type: string, enum: [G004] }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        readingTarget: { $ref: '#/components/schemas/ReadingTask' }
