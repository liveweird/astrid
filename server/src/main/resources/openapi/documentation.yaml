    MatchingPermutation3201: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R3' }, { $ref: '#/components/schemas/MatchingPairL1R2' }, { $ref: '#/components/schemas/MatchingPairL2R0' }, { $ref: '#/components/schemas/MatchingPairL3R1' }] } }
