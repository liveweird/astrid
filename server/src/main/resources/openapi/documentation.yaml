        readingSource: { $ref: '#/components/schemas/ReadingSource' }
        tileSource: { $ref: '#/components/schemas/TileSource' }
        matchingSource: { $ref: '#/components/schemas/MatchingSource' }
        gapSource: { $ref: '#/components/schemas/GapSource' }
        moduleOneSource: { $ref: '#/components/schemas/ModuleOneSource' }
        inanimateReferenceSource: { $ref: '#/components/schemas/InanimateReferenceSource' }
        modalSource: { $ref: '#/components/schemas/ModalSource' }
