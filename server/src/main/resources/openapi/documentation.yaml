        answerLanguage: { type: string, nullable: true, enum: [en] }
        passage: { type: array, minItems: 3, maxItems: 3, items: { type: string } }
    Block: { type: object, additionalProperties: false, required: [id, text], properties: { id: { type: string }, text: { type: string } } }
    Introduction:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title: { type: string }
        body: { type: string }
        bodyLanguage: { type: string, enum: [da, en] }
    AttemptRequest:
      type: object
      additionalProperties: false
      required: [attemptId, exerciseId, answer, hintUsed]
      properties:
        attemptId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        answer:
          oneOf: [{ $ref: '#/components/schemas/TextAnswer' }, { $ref: '#/components/schemas/OrderAnswer' }, { $ref: '#/components/schemas/MatchingAnswer' }, { $ref: '#/components/schemas/GapsAnswer' }]
        hintUsed: { type: boolean }
    TextAnswer:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: { type: string, enum: [text] }
        text:
          type: string
          maxLength: 512
          description: Must be well-formed Unicode. The maximum length is counted in Unicode code points.
    OrderAnswer:
      type: object
      additionalProperties: false
      required: [kind, blockIds]
      properties:
        kind: { type: string, enum: [order] }
        blockIds: { type: array, maxItems: 16, items: { type: string, maxLength: 64 } }
    MatchingAnswer:
      type: object
      additionalProperties: false
      required: [kind, pairs]
      properties:
        kind: { type: string, enum: [matching] }
        pairs:
          # Each partial bijection extends a full permutation. Keep these as composed schemas:
          # our conformance validator ignores anyOf attached directly to a typed array.
          description: A partial bijection. The list may be empty; each supplied leftId and rightId must appear at most once.
          allOf:
            - type: array
              maxItems: 4
              uniqueItems: true
              items: { $ref: '#/components/schemas/MatchingPair' }
            - anyOf:
                - { $ref: '#/components/schemas/MatchingPermutation0123' }
                - { $ref: '#/components/schemas/MatchingPermutation0132' }
                - { $ref: '#/components/schemas/MatchingPermutation0213' }
                - { $ref: '#/components/schemas/MatchingPermutation0231' }
                - { $ref: '#/components/schemas/MatchingPermutation0312' }
                - { $ref: '#/components/schemas/MatchingPermutation0321' }
                - { $ref: '#/components/schemas/MatchingPermutation1023' }
                - { $ref: '#/components/schemas/MatchingPermutation1032' }
                - { $ref: '#/components/schemas/MatchingPermutation1203' }
                - { $ref: '#/components/schemas/MatchingPermutation1230' }
                - { $ref: '#/components/schemas/MatchingPermutation1302' }
                - { $ref: '#/components/schemas/MatchingPermutation1320' }
                - { $ref: '#/components/schemas/MatchingPermutation2013' }
                - { $ref: '#/components/schemas/MatchingPermutation2031' }
                - { $ref: '#/components/schemas/MatchingPermutation2103' }
                - { $ref: '#/components/schemas/MatchingPermutation2130' }
                - { $ref: '#/components/schemas/MatchingPermutation2301' }
                - { $ref: '#/components/schemas/MatchingPermutation2310' }
                - { $ref: '#/components/schemas/MatchingPermutation3012' }
                - { $ref: '#/components/schemas/MatchingPermutation3021' }
                - { $ref: '#/components/schemas/MatchingPermutation3102' }
                - { $ref: '#/components/schemas/MatchingPermutation3120' }
                - { $ref: '#/components/schemas/MatchingPermutation3201' }
                - { $ref: '#/components/schemas/MatchingPermutation3210' }
    GapsAnswer:
      type: object
      additionalProperties: false
      required: [kind, selections]
      properties:
        kind: { type: string, enum: [gaps] }
        selections:
          description: Zero, one or both slot-scoped selections in supplied order; a slot may occur at most once.
          allOf:
            - type: array
              maxItems: 2
              uniqueItems: true
              items: { $ref: '#/components/schemas/GapSelection' }
            - anyOf:
                - { $ref: '#/components/schemas/GapAssignmentC0C0' }
                - { $ref: '#/components/schemas/GapAssignmentC0C1' }
                - { $ref: '#/components/schemas/GapAssignmentC1C0' }
                - { $ref: '#/components/schemas/GapAssignmentC1C1' }
    GapSelection:
      type: object
      additionalProperties: false
      required: [slotId, choiceId]
      properties:
        slotId: { type: string, enum: [g0, g1] }
        choiceId: { type: string, enum: [c0, c1] }
    GapSelectionG0C0: &GapSelectionG0C0
      allOf: [{ $ref: '#/components/schemas/GapSelection' }, { type: object, properties: { slotId: { type: string, enum: [g0] }, choiceId: { type: string, enum: [c0] } } }]
    GapSelectionG0C1: &GapSelectionG0C1
      allOf: [{ $ref: '#/components/schemas/GapSelection' }, { type: object, properties: { slotId: { type: string, enum: [g0] }, choiceId: { type: string, enum: [c1] } } }]
    GapSelectionG1C0: &GapSelectionG1C0
      allOf: [{ $ref: '#/components/schemas/GapSelection' }, { type: object, properties: { slotId: { type: string, enum: [g1] }, choiceId: { type: string, enum: [c0] } } }]
