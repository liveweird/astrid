        - oneOf:
            - type: object
              additionalProperties: true
              not: { required: [targetScopeId] }
              properties:
                assessmentMode: { type: string, enum: [selection, recall, repair] }
            - type: object
              additionalProperties: true
              required: [matchingTarget]
              not: { anyOf: [{ required: [targetSkillId] }, { required: [lexicalTarget] }, { required: [readingTarget] }, { required: [assessmentMode] }] }
              properties:
                matchingTarget: { $ref: '#/components/schemas/LexicalTask' }
            - type: object
              additionalProperties: true
              required: [lexicalTarget, assessmentMode, assessmentRole]
              not: { anyOf: [{ required: [targetSkillId] }, { required: [readingTarget] }, { required: [matchingTarget] }, { required: [targetScopeId] }] }
              properties:
                assessmentMode: { type: string, enum: [matching] }
                assessmentRole: { type: string, enum: [primary] }
            - type: object
              additionalProperties: true
              required: [targetSkillId, targetScopeId, assessmentMode]
              properties:
                targetSkillId: { type: string, enum: [G003] }
                targetScopeId: { type: string, enum: [human-singular, human-group] }
                assessmentMode: { type: string, enum: [selection, recall] }
            - type: object
              additionalProperties: true
              required: [targetSkillId, targetScopeId, assessmentMode]
              properties:
                targetSkillId: { type: string, enum: [G004] }
                targetScopeId: { type: string, enum: [vaere-present, named-three-verbs-present, have-possession-present, personal-introduction-present, p1-studere-present, p1-drikke-present] }
                assessmentMode: { type: string, enum: [selection, recall] }
            - type: object
              additionalProperties: true
              required: [targetSkillId, targetScopeId, assessmentMode]
              properties:
                targetSkillId: { type: string, enum: [G038] }
                targetScopeId: { type: string, enum: [inanimate-singular-subject] }
                assessmentMode: { type: string, enum: [selection, recall] }
            - type: object
              additionalProperties: true
              required: [targetSkillId, targetScopeId, assessmentMode]
              properties:
                targetSkillId: { type: string, enum: [G005] }
                targetScopeId: { type: string, enum: [subject-first-supplied, p1-subject-first-supplied] }
                assessmentMode: { type: string, enum: [constituent-order, word-order] }
            - type: object
              additionalProperties: true
              required: [targetSkillId, targetScopeId, assessmentMode]
              properties:
                targetSkillId: { type: string, enum: [G030] }
                targetScopeId: { type: string, enum: [kan-bare-infinitive] }
                assessmentMode: { type: string, enum: [selection, recall] }
            - type: object
              additionalProperties: true
              required: [targetSkillId, targetScopeId, assessmentMode]
              properties:
                targetSkillId: { type: string, enum: [G030] }
                targetScopeId: { type: string, enum: [modal-volition-meaning, modal-obligation-meaning, modal-permission-meaning] }
                assessmentMode: { type: string, enum: [selection] }
            - type: object
              additionalProperties: true
              required: [targetSkillId, targetScopeId, assessmentMode]
              properties:
                targetSkillId: { type: string, enum: [G005] }
                targetScopeId: { type: string, enum: [supplied-modal-order] }
                assessmentMode: { type: string, enum: [word-order] }
            - type: object
              additionalProperties: true
              required: [targetSkillId, targetScopeId, assessmentMode]
              properties:
                targetSkillId: { type: string, enum: [G016] }
                targetScopeId: { type: string, enum: [one-final-circumstance] }
                assessmentMode: { type: string, enum: [constituent-order] }
            - type: object
              additionalProperties: true
              required: [targetSkillId, targetScopeId, assessmentMode]
              properties:
                targetSkillId: { type: string, enum: [G018] }
                targetScopeId: { type: string, enum: [neutral-positive-yes-no] }
                assessmentMode: { type: string, enum: [constituent-order] }
    PracticeOutcomeCounts:
      type: object
      additionalProperties: false
      required: [fullyMet, targetMet, targetNotMet, unevaluable, languageUnknown, languageKnownIssue, responseConstraintNotMet]
      properties:
        fullyMet: { type: integer }
        targetMet: { type: integer }
        targetNotMet: { type: integer }
        unevaluable: { type: integer }
        languageUnknown: { type: integer }
        languageKnownIssue: { type: integer }
        responseConstraintNotMet: { type: integer }
        meaningMet: { type: integer }
        meaningNotMet: { type: integer }
        meaningUnknown: { type: integer }
    Inspector:
      type: object
      additionalProperties: false
