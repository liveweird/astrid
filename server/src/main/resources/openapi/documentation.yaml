    MatchingPermutation2301: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R2' }, { $ref: '#/components/schemas/MatchingPairL1R3' }, { $ref: '#/components/schemas/MatchingPairL2R0' }, { $ref: '#/components/schemas/MatchingPairL3R1' }] } }
    MatchingPermutation2310: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R2' }, { $ref: '#/components/schemas/MatchingPairL1R3' }, { $ref: '#/components/schemas/MatchingPairL2R1' }, { $ref: '#/components/schemas/MatchingPairL3R0' }] } }
    MatchingPermutation3012: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R3' }, { $ref: '#/components/schemas/MatchingPairL1R0' }, { $ref: '#/components/schemas/MatchingPairL2R1' }, { $ref: '#/components/schemas/MatchingPairL3R2' }] } }
    MatchingPermutation3021: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R3' }, { $ref: '#/components/schemas/MatchingPairL1R0' }, { $ref: '#/components/schemas/MatchingPairL2R2' }, { $ref: '#/components/schemas/MatchingPairL3R1' }] } }
    MatchingPermutation3102: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R3' }, { $ref: '#/components/schemas/MatchingPairL1R1' }, { $ref: '#/components/schemas/MatchingPairL2R0' }, { $ref: '#/components/schemas/MatchingPairL3R2' }] } }
    MatchingPermutation3120: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R3' }, { $ref: '#/components/schemas/MatchingPairL1R1' }, { $ref: '#/components/schemas/MatchingPairL2R2' }, { $ref: '#/components/schemas/MatchingPairL3R0' }] } }
    MatchingPermutation3201: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R3' }, { $ref: '#/components/schemas/MatchingPairL1R2' }, { $ref: '#/components/schemas/MatchingPairL2R0' }, { $ref: '#/components/schemas/MatchingPairL3R1' }] } }
    MatchingPermutation3210: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R3' }, { $ref: '#/components/schemas/MatchingPairL1R2' }, { $ref: '#/components/schemas/MatchingPairL2R1' }, { $ref: '#/components/schemas/MatchingPairL3R0' }] } }
    Attempt:
      oneOf:
        - { $ref: '#/components/schemas/NonMatchingAttempt' }
        - { $ref: '#/components/schemas/MatchingAttempt' }
    NonMatchingAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, exerciseId, targetSatisfaction, linguisticStatus, issues, feedback, completedSentence, evaluationRevision, hintUsed, retryNumber, createdAt]
      not: { required: [matchingResults] }
      properties:
        attemptId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        targetSatisfaction: { type: string, enum: [met, not-met, unevaluable] }
        linguisticStatus: { type: string, enum: [acceptable, known-issue, unknown] }
        linguisticScope: { type: string, nullable: true, enum: [english-choice, danish-choice, danish-headword, danish-sentence] }
        responseConstraintStatus: { type: string, nullable: true, enum: [met, not-met] }
        meaningSatisfaction: { type: string, nullable: true, enum: [met, not-met, unknown] }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        feedback: { type: string }
        completedSentence: { type: string }
        evaluationRevision: { type: string }
        hintUsed: { type: boolean }
        retryNumber: { type: integer, minimum: 1 }
        createdAt: { type: integer, format: int64 }
    MatchingAttempt:
      type: object
      additionalProperties: false
      required: [attemptId, exerciseId, targetSatisfaction, linguisticStatus, linguisticScope, responseConstraintStatus, meaningSatisfaction, matchingResults, issues, feedback, completedSentence, evaluationRevision, hintUsed, retryNumber, createdAt]
      properties:
        attemptId: { type: string, format: uuid }
        exerciseId: { type: string, format: uuid }
        targetSatisfaction: { type: string, enum: [met, not-met, unevaluable] }
        linguisticStatus: { type: string, enum: [acceptable, unknown] }
        linguisticScope: { type: string, enum: [danish-matching] }
        responseConstraintStatus: { type: string, enum: [met, not-met] }
        meaningSatisfaction: { type: string, enum: [met, not-met, unknown] }
        matchingResults: { type: array, minItems: 4, maxItems: 4, items: { $ref: '#/components/schemas/MatchingPairResult' } }
        issues: { type: array, items: { $ref: '#/components/schemas/Issue' } }
        feedback: { type: string }
        completedSentence: { type: string, maxLength: 0 }
        evaluationRevision: { type: string, enum: [evaluation-6] }
        hintUsed: { type: boolean }
        retryNumber: { type: integer, minimum: 1 }
        createdAt: { type: integer, format: int64 }
    MatchingPairResult:
      oneOf:
        - { $ref: '#/components/schemas/CorrectMatchingPairResult' }
        - { $ref: '#/components/schemas/WrongMatchingPairResult' }
        - { $ref: '#/components/schemas/UnmatchedMatchingPairResult' }
    CorrectMatchingPairResult: &SelectedMatchingPairResult
      type: object
      additionalProperties: false
      required: [leftId, rightId, lexicalTarget, targetSatisfaction, meaningSatisfaction, responseConstraintStatus, linguisticStatus, feedback]
      properties: &SelectedMatchingPairResultProperties
        leftId: { type: string, enum: [l0, l1, l2, l3] }
        rightId: { type: string, enum: [r0, r1, r2, r3] }
        lexicalTarget: { $ref: '#/components/schemas/MatchingLexicalTarget' }
        targetSatisfaction: { type: string, enum: [met] }
        meaningSatisfaction: { type: string, enum: [met] }
        responseConstraintStatus: { type: string, enum: [met] }
        linguisticStatus: { type: string, enum: [acceptable] }
        feedback: { type: string }
    WrongMatchingPairResult:
      <<: *SelectedMatchingPairResult
      properties:
        <<: *SelectedMatchingPairResultProperties
        targetSatisfaction: { type: string, enum: [not-met] }
        meaningSatisfaction: { type: string, enum: [not-met] }
    UnmatchedMatchingPairResult:
      type: object
      additionalProperties: false
      required: [leftId, lexicalTarget, targetSatisfaction, meaningSatisfaction, responseConstraintStatus, linguisticStatus, feedback]
      not: { required: [rightId] }
      properties:
        leftId: { type: string, enum: [l0, l1, l2, l3] }
        rightId: { type: string, enum: [r0, r1, r2, r3] }
        lexicalTarget: { $ref: '#/components/schemas/MatchingLexicalTarget' }
        targetSatisfaction: { type: string, enum: [unevaluable] }
        meaningSatisfaction: { type: string, enum: [unknown] }
        responseConstraintStatus: { type: string, enum: [not-met] }
        linguisticStatus: { type: string, enum: [unknown] }
        feedback: { type: string }
    Issue: { type: object, additionalProperties: false, required: [code, message], properties: { code: { type: string }, message: { type: string } } }
    PracticeContext:
      type: object
      additionalProperties: false
      required: [ownerSessionId, sessionExpiresAt, focusId, title, planRevision, itemCount]
      properties:
        ownerSessionId: { type: string, format: uuid }
        sessionExpiresAt: { type: integer, format: int64 }
        focusId: { type: string, enum: [reading-basics] }
        title: { type: string }
        planRevision: { type: string, enum: [practice-1] }
        itemCount: { type: integer, enum: [8] }
    PracticeProfiles:
      type: object
      additionalProperties: false
      required: [ownerSessionId, sessionExpiresAt, profiles]
      properties:
        ownerSessionId: { type: string, format: uuid }
        sessionExpiresAt: { type: integer, format: int64 }
        profiles: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/PracticeProfile' } }
    PracticeProfile:
      oneOf:
        - type: object
          additionalProperties: false
          required: [focusId, planRevision, title, description, itemCount, prerequisiteSkillIds]
          properties:
            focusId: { type: string, enum: [reading-basics] }
            planRevision: { type: string, enum: [practice-1] }
            title: { type: string }
            description: { type: string }
            itemCount: { type: integer, enum: [8] }
            prerequisiteSkillIds: { type: array, items: { type: string } }
        - type: object
          additionalProperties: false
          required: [focusId, planRevision, title, description, itemCount, prerequisiteSkillIds]
          properties:
            focusId: { type: string, enum: [present-verbs] }
            planRevision: { type: string, enum: [present-verbs-1] }
            title: { type: string }
            description: { type: string }
            itemCount: { type: integer, enum: [6] }
            prerequisiteSkillIds: { type: array, items: { type: string } }
    PracticeSessionRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [practiceSessionId, focusId, planRevision, seed]
          properties:
            practiceSessionId: { type: string, format: uuid }
            focusId: { type: string, enum: [reading-basics] }
            planRevision: { type: string, enum: [practice-1] }
            seed: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [practiceSessionId, focusId, planRevision, seed]
          properties:
            practiceSessionId: { type: string, format: uuid }
            focusId: { type: string, enum: [present-verbs] }
            planRevision: { type: string, enum: [present-verbs-1] }
            seed: { type: integer, minimum: 0 }
    PracticeSupportRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [introduction, lesson, hint] }
        position: { type: integer, minimum: 0, maximum: 7 }
    PracticeFollowUpRequest:
      type: object
      additionalProperties: false
      required: [practiceSessionId, planRevision, seed, targetKeys]
      properties:
        practiceSessionId: { type: string, format: uuid }
        planRevision: { type: string, enum: [follow-up-1, follow-up-2] }
        seed: { type: integer, minimum: 0 }
        targetKeys: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 160 } }
    PracticeAdvanceRequest:
      type: object
      additionalProperties: false
      required: [position]
      properties:
        position: { type: integer, minimum: 0, maximum: 7 }
    PracticeSession:
      type: object
      additionalProperties: false
      required: [id, ownerSessionId, focusId, title, planRevision, seed, contentRevision, generatorRevision, evaluationRevision, sessionExpiresAt, state, cursor, itemCount, prerequisiteSkillIds, introduction, introductionOpened, items, summary]
      properties:
        id: { type: string, format: uuid }
        ownerSessionId: { type: string, format: uuid }
        focusId: { type: string }
        title: { type: string }
        planRevision: { type: string }
        seed: { type: integer }
        contentRevision: { type: string }
        generatorRevision: { type: string }
        evaluationRevision: { type: string }
        sessionExpiresAt: { type: integer, format: int64 }
        state: { type: string, enum: [active, completed] }
        cursor: { type: integer, minimum: 0, maximum: 8 }
        itemCount: { type: integer, minimum: 1, maximum: 8 }
        prerequisiteSkillIds: { type: array, items: { type: string } }
        introduction: { type: array, items: { $ref: '#/components/schemas/Introduction' } }
        introductionOpened: { type: boolean }
        items: { type: array, items: { $ref: '#/components/schemas/PracticeItem' } }
        currentExercise: { $ref: '#/components/schemas/PracticeExercise' }
        summary: { $ref: '#/components/schemas/PracticeSummary' }
        followUp: { $ref: '#/components/schemas/PracticeFollowUp' }
        followUpPlanRevision: { type: string, enum: [follow-up-2] }
    PracticeFollowUp:
      type: object
      additionalProperties: false
      required: [sourcePracticeSessionId, selectedTargetKeys]
      properties:
        sourcePracticeSessionId: { type: string, format: uuid }
        selectedTargetKeys: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string } }
    PracticeItem:
      type: object
      additionalProperties: false
      required: [position, exerciseId, formatId, lessonOpened, hintOpened, attemptIds, attemptCount]
      properties:
        position: { type: integer }
        exerciseId: { type: string, format: uuid }
        formatId: { type: string }
        targetSkillId: { type: string, nullable: true }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        assessmentMode: { type: string, enum: [selection, recall, repair] }
        lessonOpened: { type: boolean }
        hintOpened: { type: boolean }
        attemptIds: { type: array, items: { type: string, format: uuid } }
        attemptCount: { type: integer, minimum: 0 }
        firstAttempt: { $ref: '#/components/schemas/NonMatchingAttempt' }
        lastAttempt: { $ref: '#/components/schemas/NonMatchingAttempt' }
        firstAnswer:
          oneOf: [{ $ref: '#/components/schemas/TextAnswer' }, { $ref: '#/components/schemas/OrderAnswer' }]
        lastAnswer:
          oneOf: [{ $ref: '#/components/schemas/TextAnswer' }, { $ref: '#/components/schemas/OrderAnswer' }]
        firstAttemptContext: { $ref: '#/components/schemas/PracticeAttemptContext' }
        lastAttemptContext: { $ref: '#/components/schemas/PracticeAttemptContext' }
    PracticeExercise:
      oneOf:
        - { $ref: '#/components/schemas/GrammarExercise' }
        - { $ref: '#/components/schemas/LexicalExercise' }
        - { $ref: '#/components/schemas/WritingExercise' }
        - { $ref: '#/components/schemas/ReadingExercise' }
        - { $ref: '#/components/schemas/TileExercise' }
    PracticeAttemptContext:
      type: object
      additionalProperties: false
      required: [introductionOpened, lessonOpened, hintOpened, priorExposure]
      properties:
        introductionOpened: { type: boolean }
        lessonOpened: { type: boolean }
        hintOpened: { type: boolean }
        priorExposure: { type: array, items: { $ref: '#/components/schemas/PracticePriorExposure' } }
        sourceExposure: { type: array, items: { $ref: '#/components/schemas/PracticeCrossRunExposure' } }
    PracticePriorExposure:
      type: object
      additionalProperties: false
      required: [position, source, keys]
      properties:
        position: { type: integer }
        source: { type: string, enum: [prompt, lesson, hint, feedback] }
        keys: { type: array, items: { type: string } }
    PracticeCrossRunExposure:
      type: object
      additionalProperties: false
      required: [practiceSessionId, position, source, keys]
      properties:
        practiceSessionId: { type: string, format: uuid }
        position: { type: integer, minimum: -1, maximum: 7 }
        source: { type: string, enum: [introduction, prompt, lesson, hint, feedback] }
        keys: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
    PracticeSummary:
      type: object
      additionalProperties: false
      required: [plannedItems, attemptedItems, completedItems, attemptCount, retryCount, introductionOpened, rows]
      properties:
        plannedItems: { type: integer }
        attemptedItems: { type: integer }
        completedItems: { type: integer }
        attemptCount: { type: integer }
        retryCount: { type: integer }
        introductionOpened: { type: boolean }
        rows: { type: array, items: { $ref: '#/components/schemas/PracticeSummaryRow' } }
    PracticeSummaryRow:
      type: object
      additionalProperties: false
      required: [label, plannedItems, attemptedItems, advancedItems, attemptCount, retryCount, firstOutcomes, latestOutcomes, firstWithSupport, firstWithPriorExposure, lessonOpenedItems, hintOpenedItems]
      properties:
        label: { type: string }
        targetSkillId: { type: string, nullable: true }
        lexicalTarget: { $ref: '#/components/schemas/LexicalTarget' }
        assessmentMode: { type: string, enum: [selection, recall, repair] }
        plannedItems: { type: integer }
        attemptedItems: { type: integer }
        advancedItems: { type: integer }
        attemptCount: { type: integer }
        retryCount: { type: integer }
        firstOutcomes: { $ref: '#/components/schemas/PracticeOutcomeCounts' }
        latestOutcomes: { $ref: '#/components/schemas/PracticeOutcomeCounts' }
        firstWithSupport: { type: integer }
        firstWithPriorExposure: { type: integer }
        lessonOpenedItems: { type: integer }
        hintOpenedItems: { type: integer }
    PracticeOutcomeCounts:
      type: object
      additionalProperties: false
      required: [fullyMet, targetMet, targetNotMet, unevaluable, languageUnknown, languageKnownIssue, responseConstraintNotMet]
      properties:
        fullyMet: { type: integer }
        targetMet: { type: integer }
        targetNotMet: { type: integer }
        unevaluable: { type: integer }
        languageUnknown: { type: integer }
        languageKnownIssue: { type: integer }
        responseConstraintNotMet: { type: integer }
    Inspector:
      type: object
      additionalProperties: false
      required: [exercise, seed, index, lexicalIds, clauseRoles]
      properties:
        exercise: { $ref: '#/components/schemas/Exercise' }
        seed: { type: integer }
        index: { type: integer }
        canonicalSentenceId: { type: string, nullable: true }
        constructionId: { type: string, nullable: true }
        lexicalIds: { type: array, items: { type: string } }
        clauseRoles: { type: array, items: { type: string } }
        canonicalSentence: { type: string, nullable: true }
        lexicalSource: { $ref: '#/components/schemas/LexicalSource' }
        readingSource: { $ref: '#/components/schemas/ReadingSource' }
        tileSource: { $ref: '#/components/schemas/TileSource' }
        matchingSource: { $ref: '#/components/schemas/MatchingSource' }
    LexicalSource:
      type: object
      additionalProperties: false
      required: [entryId, senseId, headword, gloss, article]
      properties:
        entryId: { type: string }
        senseId: { type: string }
        headword: { type: string }
        gloss: { type: string }
        article: { type: string }
    ReadingSource:
      type: object
      additionalProperties: false
      required: [propositions, questionSubjectId, questionVerbId, answerNounId, answer]
      properties:
        propositions: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/ReadingProposition' } }
        questionSubjectId: { type: string }
        questionVerbId: { type: string }
        answerNounId: { type: string }
        answer: { type: string }
    ReadingProposition:
      type: object
      additionalProperties: false
      required: [sentenceId, subjectId, verbId, objectId]
      properties:
        sentenceId: { type: string }
        subjectId: { type: string }
        verbId: { type: string }
        objectId: { type: string }
    TileSource:
      type: object
      additionalProperties: false
      required: [tokens, licensedOrders, distractors]
      properties:
        tokens: { type: array, minItems: 2, maxItems: 5, items: { $ref: '#/components/schemas/TileToken' } }
        licensedOrders: { type: array, minItems: 1, maxItems: 2, items: { $ref: '#/components/schemas/TileLicensedOrder' } }
        distractors: { type: array, maxItems: 1, items: { $ref: '#/components/schemas/TileDistractor' } }
    TileToken:
      type: object
      additionalProperties: false
      required: [blockId, lexicalId, form]
      properties:
        blockId: { type: string }
        lexicalId: { type: string }
        form: { type: string, enum: [subject, finite-present, infinitive, article, singular-headword] }
    TileLicensedOrder:
      type: object
      additionalProperties: false
      required: [kind, blockIds]
      properties:
        kind: { type: string, enum: [subject-first, fronted] }
        blockIds: { type: array, minItems: 2, maxItems: 4, items: { type: string } }
    TileDistractor:
      type: object
      additionalProperties: false
      required: [blockId, rationale]
      properties:
        blockId: { type: string }
        rationale: { type: string }
    MatchingSource:
      type: object
      additionalProperties: false
      required: [pairs]
      properties:
        pairs: { type: array, minItems: 4, maxItems: 4, items: { $ref: '#/components/schemas/MatchingPairSource' } }
    MatchingPairSource:
      type: object
      additionalProperties: false
      required: [leftId, rightId, lexicalSource]
      properties:
        leftId: { type: string, enum: [l0, l1, l2, l3] }
        rightId: { type: string, enum: [r0, r1, r2, r3] }
        lexicalSource: { $ref: '#/components/schemas/LexicalSource' }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code]
      properties:
        type: { type: string, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
    Health: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string } } }
