    MatchingPermutation0123: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R0' }, { $ref: '#/components/schemas/MatchingPairL1R1' }, { $ref: '#/components/schemas/MatchingPairL2R2' }, { $ref: '#/components/schemas/MatchingPairL3R3' }] } }
    MatchingPermutation0132: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R0' }, { $ref: '#/components/schemas/MatchingPairL1R1' }, { $ref: '#/components/schemas/MatchingPairL2R3' }, { $ref: '#/components/schemas/MatchingPairL3R2' }] } }
    MatchingPermutation0213: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R0' }, { $ref: '#/components/schemas/MatchingPairL1R2' }, { $ref: '#/components/schemas/MatchingPairL2R1' }, { $ref: '#/components/schemas/MatchingPairL3R3' }] } }
