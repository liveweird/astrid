    MatchingPermutation0312: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R0' }, { $ref: '#/components/schemas/MatchingPairL1R3' }, { $ref: '#/components/schemas/MatchingPairL2R1' }, { $ref: '#/components/schemas/MatchingPairL3R2' }] } }
    MatchingPermutation0321: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R0' }, { $ref: '#/components/schemas/MatchingPairL1R3' }, { $ref: '#/components/schemas/MatchingPairL2R2' }, { $ref: '#/components/schemas/MatchingPairL3R1' }] } }
    MatchingPermutation1023: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R1' }, { $ref: '#/components/schemas/MatchingPairL1R0' }, { $ref: '#/components/schemas/MatchingPairL2R2' }, { $ref: '#/components/schemas/MatchingPairL3R3' }] } }
    MatchingPermutation1032: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R1' }, { $ref: '#/components/schemas/MatchingPairL1R0' }, { $ref: '#/components/schemas/MatchingPairL2R3' }, { $ref: '#/components/schemas/MatchingPairL3R2' }] } }
    MatchingPermutation1203: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R1' }, { $ref: '#/components/schemas/MatchingPairL1R2' }, { $ref: '#/components/schemas/MatchingPairL2R0' }, { $ref: '#/components/schemas/MatchingPairL3R3' }] } }
    MatchingPermutation1230: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R1' }, { $ref: '#/components/schemas/MatchingPairL1R2' }, { $ref: '#/components/schemas/MatchingPairL2R3' }, { $ref: '#/components/schemas/MatchingPairL3R0' }] } }
    MatchingPermutation1302: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R1' }, { $ref: '#/components/schemas/MatchingPairL1R3' }, { $ref: '#/components/schemas/MatchingPairL2R0' }, { $ref: '#/components/schemas/MatchingPairL3R2' }] } }
    MatchingPermutation1320: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R1' }, { $ref: '#/components/schemas/MatchingPairL1R3' }, { $ref: '#/components/schemas/MatchingPairL2R2' }, { $ref: '#/components/schemas/MatchingPairL3R0' }] } }
    MatchingPermutation2013: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R2' }, { $ref: '#/components/schemas/MatchingPairL1R0' }, { $ref: '#/components/schemas/MatchingPairL2R1' }, { $ref: '#/components/schemas/MatchingPairL3R3' }] } }
    MatchingPermutation2031: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R2' }, { $ref: '#/components/schemas/MatchingPairL1R0' }, { $ref: '#/components/schemas/MatchingPairL2R3' }, { $ref: '#/components/schemas/MatchingPairL3R1' }] } }
    MatchingPermutation2103: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R2' }, { $ref: '#/components/schemas/MatchingPairL1R1' }, { $ref: '#/components/schemas/MatchingPairL2R0' }, { $ref: '#/components/schemas/MatchingPairL3R3' }] } }
    MatchingPermutation2130: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R2' }, { $ref: '#/components/schemas/MatchingPairL1R1' }, { $ref: '#/components/schemas/MatchingPairL2R3' }, { $ref: '#/components/schemas/MatchingPairL3R0' }] } }
    MatchingPermutation2301: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R2' }, { $ref: '#/components/schemas/MatchingPairL1R3' }, { $ref: '#/components/schemas/MatchingPairL2R0' }, { $ref: '#/components/schemas/MatchingPairL3R1' }] } }
    MatchingPermutation2310: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R2' }, { $ref: '#/components/schemas/MatchingPairL1R3' }, { $ref: '#/components/schemas/MatchingPairL2R1' }, { $ref: '#/components/schemas/MatchingPairL3R0' }] } }
    MatchingPermutation3012: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R3' }, { $ref: '#/components/schemas/MatchingPairL1R0' }, { $ref: '#/components/schemas/MatchingPairL2R1' }, { $ref: '#/components/schemas/MatchingPairL3R2' }] } }
    MatchingPermutation3021: { type: array, items: { anyOf: [{ $ref: '#/components/schemas/MatchingPairL0R3' }, { $ref: '#/components/schemas/MatchingPairL1R0' }, { $ref: '#/components/schemas/MatchingPairL2R2' }, { $ref: '#/components/schemas/MatchingPairL3R1' }] } }
