        forms: { $ref: '#/components/schemas/VocabularyLexicalForms' }
        gloss: { type: string }
        selectedUse: { type: string }
    VocabularyLexicalForms:
      type: object
      additionalProperties: false
      properties:
        infinitive: { type: string }
        present: { type: string }
        bundle: { type: string }
        form: { type: string }
      minProperties: 1
    VocabularySupportFact:
      type: object
      additionalProperties: false
      required: [factId, referentId, predicateId, valueId, valueText, valueRole, sentence, exposureKeys]
      properties:
        factId: { type: string }
        referentId: { type: string }
        predicateId: { type: string }
        valueId: { type: string }
        valueText: { type: string }
        valueRole: { type: string, enum: [action, object, place, time] }
        sentence: { type: string }
        exposureKeys: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
    VocabularyKnownAlternative:
      type: object
      additionalProperties: false
      required: [text, targetSatisfaction, linguisticStatus, meaningSatisfaction, responseConstraintStatus]
      properties:
        text: { type: string }
        targetSatisfaction: { type: string, enum: [met, not-met, unevaluable] }
        linguisticStatus: { type: string, enum: [acceptable, known-issue, unknown] }
        meaningSatisfaction: { type: string, enum: [met, not-met, unknown] }
        responseConstraintStatus: { type: string, enum: [met, not-met] }
        issueCode: { type: string }
    VocabularyReviewedOrder:
      type: object
      additionalProperties: false
      required: [words, targetSatisfaction, linguisticStatus, meaningSatisfaction, responseConstraintStatus]
      properties:
        words: { type: array, minItems: 1, items: { type: string } }
        targetSatisfaction: { type: string, enum: [met, not-met, unevaluable] }
        linguisticStatus: { type: string, enum: [acceptable, known-issue, unknown] }
        meaningSatisfaction: { type: string, enum: [met, not-met, unknown] }
        responseConstraintStatus: { type: string, enum: [met, not-met] }
        issueCode: { type: string }
    VocabularyMatchingPairSource:
      type: object
      additionalProperties: false
      required: [leftId, rightId, lexicalSource]
      properties:
        leftId: { type: string, pattern: '^m-[0-9a-z]+$' }
        rightId: { type: string, pattern: '^n-[0-9a-z]+$' }
        lexicalSource: { $ref: '#/components/schemas/VocabularyLexicalSource' }
    VocabularyTileOccurrence:
      type: object
      additionalProperties: false
      required: [blockId, lexicalId, form]
      properties:
        blockId: { type: string }
        lexicalId: { type: string }
        form: { type: string }
    InanimateReferenceSource:
      type: object
      additionalProperties: false
      required: [taskId, targetEntryId, targetSenseId, expectedForm, antecedentEntryId, antecedentSenseId, antecedentArticle, antecedentGender, antecedentNumber, requestedRole, casePolicy, contextVariantId, knownAlternativeForms, choiceRationales]
      properties:
        taskId: { type: string }
        targetEntryId: { type: string }
        targetSenseId: { type: string }
        expectedForm: { type: string }
        antecedentEntryId: { type: string }
        antecedentSenseId: { type: string }
        antecedentArticle: { type: string }
        antecedentGender: { type: string, enum: [common, neuter] }
        antecedentNumber: { type: string, enum: [singular] }
        requestedRole: { type: string, enum: [subject] }
        casePolicy: { type: string, enum: [standalone-introduced-form-1] }
        contextVariantId: { type: string }
        knownAlternativeForms: { type: array, items: { type: string } }
        choiceRationales: { type: array, items: { $ref: '#/components/schemas/ModuleOneChoiceRationale' } }
    ModuleOneSource:
      type: object
      additionalProperties: false
      required: [taskId, targetLexicalId, expectedForm, knownAlternativeForms, casePolicy, choiceRationales]
      properties:
        taskId: { type: string }
        targetLexicalId: { type: string }
        expectedForm: { type: string }
        knownAlternativeForms: { type: array, items: { type: string } }
        referenceRole: { type: string, nullable: true }
        frameVariantId: { type: string, nullable: true }
        casePolicy: { type: string }
        choiceRationales: { type: array, items: { $ref: '#/components/schemas/ModuleOneChoiceRationale' } }
    ModuleOneChoiceRationale:
      type: object
      additionalProperties: false
      required: [choice, rationale]
      properties:
        choice: { type: string }
        rationale: { type: string }
    LexicalSource:
      type: object
      additionalProperties: false
      required: [entryId, senseId, headword, gloss, article]
      properties:
        entryId: { type: string }
        senseId: { type: string }
        headword: { type: string }
        gloss: { type: string }
        article: { type: string }
    ReadingSource:
      type: object
      additionalProperties: false
      required: [propositions, questionSubjectId, questionVerbId, answerNounId, answer]
      properties:
        propositions: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/ReadingProposition' } }
        questionSubjectId: { type: string }
        questionVerbId: { type: string }
        answerNounId: { type: string }
        answer: { type: string }
    ReadingProposition:
      type: object
      additionalProperties: false
      required: [sentenceId, subjectId, verbId, objectId]
      properties:
        sentenceId: { type: string }
        subjectId: { type: string }
        verbId: { type: string }
        objectId: { type: string }
    TileSource:
      type: object
      additionalProperties: false
      required: [tokens, licensedOrders, distractors]
      properties:
        tokens: { type: array, minItems: 2, maxItems: 5, items: { $ref: '#/components/schemas/TileToken' } }
        licensedOrders: { type: array, minItems: 1, maxItems: 2, items: { $ref: '#/components/schemas/TileLicensedOrder' } }
        distractors: { type: array, maxItems: 1, items: { $ref: '#/components/schemas/TileDistractor' } }
    TileToken:
      type: object
      additionalProperties: false
      required: [blockId, lexicalId, form]
      properties:
        blockId: { type: string }
        lexicalId: { type: string }
        form: { type: string, enum: [subject, finite-present, infinitive, article, singular-headword, supplied-noun-bundle, finite-modal, bare-infinitive, finite-verb, object, circumstance, location-complement] }
    TileLicensedOrder:
      type: object
      additionalProperties: false
      required: [kind, blockIds]
      properties:
        kind: { type: string, enum: [subject-first, fronted, subject-modal-infinitive-object, s12-work-final-time, s12-read-final-time, s12-work-final-place, s13-read-count-noun-question, s13-work-question, s13-residence-question, s13-possession-question] }
        blockIds: { type: array, minItems: 2, maxItems: 5, items: { type: string } }
    TileDistractor:
      type: object
      additionalProperties: false
      required: [blockId, rationale]
      properties:
        blockId: { type: string }
        rationale: { type: string }
    MatchingSource:
      type: object
      additionalProperties: false
      required: [pairs]
      properties:
        pairs: { type: array, minItems: 4, maxItems: 4, items: { $ref: '#/components/schemas/MatchingPairSource' } }
    MatchingPairSource:
      type: object
      additionalProperties: false
      required: [leftId, rightId, lexicalSource]
      properties:
        leftId: { type: string, enum: [l0, l1, l2, l3] }
        rightId: { type: string, enum: [r0, r1, r2, r3] }
        lexicalSource: { $ref: '#/components/schemas/LexicalSource' }
    GapSource:
      type: object
      additionalProperties: false
      required: [slots]
      properties:
        slots:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          description: Private source rows appear exactly once each in g0, g1 order; inspector tests enforce identity and order.
          items: { $ref: '#/components/schemas/GapSlotSource' }
    GapSlotSource:
      oneOf:
        - { $ref: '#/components/schemas/PrimaryGapSlotSource' }
        - { $ref: '#/components/schemas/SupportGapSlotSource' }
    PrimaryGapSlotSource: &GapSlotSourceObject
      type: object
      additionalProperties: false
      required: [slotId, expectedChoiceId, lexicalId, expectedForm, alternativeForm]
      properties: &GapSlotSourceProperties
        slotId: { type: string, enum: [g0] }
        expectedChoiceId: { type: string, enum: [c0, c1] }
        lexicalId: { type: string }
        expectedForm: { type: string }
        alternativeForm: { type: string }
    SupportGapSlotSource:
      <<: *GapSlotSourceObject
      properties:
        <<: *GapSlotSourceProperties
        slotId: { type: string, enum: [g1] }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code]
      properties:
        type: { type: string, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
    Health: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string } } }
